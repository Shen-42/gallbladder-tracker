spring.application.name=gallbladder-tracker
spring.datasource.url=jdbc:postgresql://localhost:5432/gallbladder
spring.datasource.username=gallbladder
spring.datasource.password=gallbladder
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.tracking-modes=cookie
# Free key from https://fdc.nal.usda.gov/api-key-signup. DEMO_KEY works but allows only a few searches an hour.
usda.api-key=${USDA_API_KEY:DEMO_KEY}
