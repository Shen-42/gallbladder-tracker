<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${episodeId == null} ? 'Log pain' : 'Edit pain'">Log pain</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <meta name="theme-color" content="#2a5d9f">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1 th:text="${episodeId == null} ? 'Log pain' : 'Edit pain'">Log pain</h1>

    <form th:if="${episodeId == null}" class="quick" th:action="@{/episodes/quick}" method="post">
        <h2>Hurting right now?</h2>
        <p class="hint">Tap how bad it is to save it with the time now. Fill in the rest later.</p>
        <div class="quick-options">
            <button th:each="n : ${#numbers.sequence(0, 10)}" type="submit" name="severity" th:value="${n}"
                    class="secondary" th:text="${n}">0</button>
        </div>
        <div class="scale-anchors"><span>0 = no pain</span><span>10 = worst pain imaginable</span></div>
        <h2>Or the full form</h2>
    </form>

    <form th:action="${episodeId == null} ? @{/episodes} : @{/episodes/{id}(id=${episodeId})}" th:object="${episodeForm}" method="post">
        <label>Started
            <input type="datetime-local" th:field="*{startedAt}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('startedAt')}" th:errors="*{startedAt}"></p>

        <label>Ended <small>optional, leave empty if it hasn't stopped</small>
            <input type="datetime-local" th:field="*{endedAt}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('endedAt')}" th:errors="*{endedAt}"></p>

        <fieldset class="scale">
            <legend>How bad is the pain?</legend>
            <div class="scale-options">
                <label th:each="n : ${#numbers.sequence(0, 10)}">
                    <input type="radio" th:field="*{severity}" th:value="${n}">
                    <span th:text="${n}">0</span>
                </label>
            </div>
            <div class="scale-anchors"><span>0 = no pain</span><span>10 = worst pain imaginable</span></div>
        </fieldset>
        <p class="error" th:if="${#fields.hasErrors('severity')}" th:errors="*{severity}"></p>

        <label>Where <small>optional</small>
            <input list="locations" autocomplete="off" th:field="*{location}">
        </label>
        <datalist id="locations">
            <option value="upper right abdomen"></option>
            <option value="upper middle abdomen"></option>
            <option value="right shoulder"></option>
            <option value="back, between the shoulder blades"></option>
        </datalist>

        <label>Note <small>optional</small>
            <input type="text" th:field="*{note}">
        </label>

        <div class="form-buttons">
            <button type="submit">Save pain</button>
            <a th:href="${episodeId == null} ? @{/days} : @{/episodes/{id}(id=${episodeId})}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
