<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mealId == null} ? 'Log a meal' : 'Edit meal'">Log a meal</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <meta name="theme-color" content="#2a5d9f">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <meta name="csrf-token" th:content="${_csrf.token}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1 th:text="${mealId == null} ? 'Log a meal' : 'Edit meal'">Log a meal</h1>

    <p class="notice" th:if="${noFatLimit}">No fat limit set yet, so meals can't be flagged as over it.
        <a th:href="@{/settings}">Set one in Settings</a></p>

    <section th:unless="${recentMeals.isEmpty()}">
        <h2>Same as before</h2>
        <p class="hint">Tap a meal to log it again, eaten now.</p>
        <ul class="recent">
            <li th:each="m : ${recentMeals}">
                <form th:action="@{/meals/{id}/relog(id=${m.id})}" method="post">
                    <button type="submit" class="secondary">
                        <span class="what" th:text="${#strings.listJoin(m.items.![food.name], ', ')}">Meal</span>
                        <span th:text="|${#numbers.formatDecimal(m.fatTotal(), 1, 1)} g fat|">0 g fat</span>
                    </button>
                </form>
            </li>
        </ul>
        <h2>Or something new</h2>
    </section>

    <form th:action="${mealId == null} ? @{/meals} : @{/meals/{id}(id=${mealId})}" th:object="${mealForm}" method="post">
        <label>When
            <input type="datetime-local" th:field="*{eatenAt}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('eatenAt')}" th:errors="*{eatenAt}"></p>

        <div id="items">
            <fieldset class="item" th:each="item, s : *{items}">
                <label>Food
                    <input list="foods" autocomplete="off" th:field="*{items[__${s.index}__].foodName}">
                </label>
                <p class="error" th:if="${s.first}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                <div class="usda" hidden aria-live="polite"></div>
                <p class="error" th:if="${#fields.hasErrors('items[__${s.index}__].foodName')}"
                   th:errors="*{items[__${s.index}__].foodName}"></p>

                <div class="row">
                    <label>Amount
                        <input type="number" step="any" min="0" inputmode="decimal"
                               th:field="*{items[__${s.index}__].amount}">
                    </label>
                    <label>Unit
                        <select th:field="*{items[__${s.index}__].unit}">
                            <option th:value="GRAMS">grams</option>
                            <option th:value="PORTIONS">portions (e.g. 2 eggs)</option>
                        </select>
                    </label>
                </div>
                <p class="error" th:if="${#fields.hasErrors('items[__${s.index}__].amount')}"
                   th:errors="*{items[__${s.index}__].amount}"></p>

                <div class="fat-field">
                    <label>Fat per 100 g <small>new food, so enter it once</small>
                        <input type="number" step="any" min="0" max="100" inputmode="decimal"
                               th:field="*{items[__${s.index}__].fatPer100g}">
                    </label>
                    <p class="error" th:if="${#fields.hasErrors('items[__${s.index}__].fatPer100g')}"
                       th:errors="*{items[__${s.index}__].fatPer100g}"></p>
                </div>

                <div class="portion-field">
                    <label>Grams per portion <small>this food has no portion size yet</small>
                        <input type="number" step="any" min="0" inputmode="decimal"
                               th:field="*{items[__${s.index}__].portionGrams}">
                    </label>
                    <p class="error" th:if="${#fields.hasErrors('items[__${s.index}__].portionGrams')}"
                       th:errors="*{items[__${s.index}__].portionGrams}"></p>
                </div>
            </fieldset>
        </div>
        <datalist id="foods">
            <option th:each="f : ${foods}" th:value="${f.name}" th:data-portion="${f.portionGrams != null}"></option>
        </datalist>

        <button type="button" id="add-item" class="secondary">+ Add another food</button>

        <label>Note <small>optional</small>
            <input type="text" th:field="*{note}">
        </label>

        <label class="confirm" th:if="${askConfirmLarge or mealForm.confirmLarge}">
            <input type="checkbox" th:field="*{confirmLarge}"> Yes, the amounts over 2,000 g are right
        </label>

        <div class="form-buttons">
            <button type="submit">Save meal</button>
            <a th:href="${mealId == null} ? @{/days} : @{/meals/{id}(id=${mealId})}">Cancel</a>
        </div>
    </form>
</main>
<script th:inline="javascript">
    // Copy the last food row, renumber its fields, and clear them.
    document.getElementById('add-item').addEventListener('click', () => {
        const rows = document.querySelectorAll('#items .item');
        const copy = rows[rows.length - 1].cloneNode(true);
        copy.querySelectorAll('.error').forEach(e => e.remove());
        copy.querySelectorAll('.usda').forEach(box => { box.hidden = true; box.replaceChildren(); });
        copy.querySelectorAll('[name]').forEach(el => {
            el.name = el.name.replace(/items\[\d+\]/, `items[${rows.length}]`);
            el.removeAttribute('id');
            el.value = el.tagName === 'SELECT' ? 'GRAMS' : '';
        });
        document.getElementById('items').appendChild(copy);
        showNeededFields(copy);
        copy.querySelector('input').focus();
    });

    // USDA search: typing a food name you haven't logged before looks it up, and picking a result saves it.
    const usdaUrl = /*[[@{/foods/usda}]]*/ '/foods/usda';
    const datalist = document.getElementById('foods');
    const known = new Set([...datalist.options].map(o => o.value.toLowerCase()));
    const timers = new WeakMap();
    const withPortion = new Set([...datalist.options].filter(o => o.dataset.portion === 'true')
        .map(o => o.value.toLowerCase()));

    // Fat per 100 g is only asked for a new food, grams per portion only for portions of a food without a
    // portion size. A field stays visible if it has a value or an error. Without JavaScript, both always show.
    function showNeededFields(row) {
        const name = row.querySelector('[name$=".foodName"]').value.trim().toLowerCase();
        const isNew = name !== '' && !known.has(name);
        const portions = row.querySelector('[name$=".unit"]').value === 'PORTIONS';
        const keep = field => field.querySelector('input').value !== '' || field.querySelector('.error') !== null;
        const fat = row.querySelector('.fat-field'), portion = row.querySelector('.portion-field');
        fat.hidden = !(isNew || keep(fat));
        portion.hidden = !((portions && (isNew || !withPortion.has(name))) || keep(portion));
    }
    document.querySelectorAll('#items .item').forEach(showNeededFields);
    document.getElementById('items').addEventListener('change', event => showNeededFields(event.target.closest('.item')));

    function show(box, ...children) {
        box.replaceChildren(...children);
        box.hidden = children.length === 0;
    }

    function text(tag, content, className) {
        const el = document.createElement(tag);
        el.textContent = content;
        if (className) el.className = className;
        return el;
    }

    function enterYourself(box, message) {
        show(box, text('p', message + ' Enter the fat per 100 g yourself below.', 'error'));
    }

    async function search(row, query) {
        const box = row.querySelector('.usda');
        row.dataset.query = query;
        const spinner = text('p', 'Searching USDA…', 'hint');
        spinner.prepend(text('span', '', 'spinner'));
        show(box, spinner);
        let body;
        try {
            const response = await fetch(usdaUrl + '?q=' + encodeURIComponent(query));
            body = await response.json();
            if (!response.ok) throw new Error(body.error);
        } catch (e) {
            if (row.dataset.query === query) enterYourself(box, e.message || "USDA search isn't reachable right now.");
            return;
        }
        if (row.dataset.query !== query) return; // a newer search has started
        if (body.length === 0) {
            enterYourself(box, 'No USDA match for "' + query + '".');
            return;
        }
        const list = document.createElement('ul');
        for (const result of body) {
            const button = text('button', '', 'secondary');
            button.type = 'button';
            button.append(text('span', result.name, 'what'), text('span', result.fatPer100g + ' g fat / 100 g'));
            button.addEventListener('click', () => pick(row, result));
            const li = document.createElement('li');
            li.append(button);
            list.append(li);
        }
        const none = text('button', 'None of these, I\'ll enter it myself', 'link');
        none.type = 'button';
        none.addEventListener('click', () => show(box));
        show(box, text('p', 'From USDA, tap one to use it:', 'hint'), list, none);
    }

    async function pick(row, result) {
        const box = row.querySelector('.usda');
        try {
            const csrf = {[document.querySelector('meta[name=csrf-header]').content]:
                    document.querySelector('meta[name=csrf-token]').content};
            const response = await fetch(usdaUrl, {method: 'POST', headers: csrf, body: new URLSearchParams(result)});
            if (!response.ok) throw new Error();
            const food = await response.json();
            row.querySelector('[name$=".foodName"]').value = food.name;
            row.querySelector('[name$=".fatPer100g"]').value = food.fatPer100g;
            known.add(food.name.toLowerCase());
            showNeededFields(row);
            const option = document.createElement('option');
            option.value = food.name;
            datalist.append(option);
            show(box, text('p', 'Saved "' + food.name + '" with ' + food.fatPer100g + ' g fat per 100 g.', 'hint'));
        } catch (e) {
            enterYourself(box, "Couldn't save that food.");
        }
    }

    document.getElementById('items').addEventListener('input', event => {
        if (!event.target.matches('[name$=".foodName"]')) return;
        const row = event.target.closest('.item');
        const query = event.target.value.trim();
        clearTimeout(timers.get(row));
        delete row.dataset.query;
        if (query.length < 3 || known.has(query.toLowerCase())) {
            show(row.querySelector('.usda'));
            return;
        }
        timers.set(row, setTimeout(() => search(row, query), 700));
    });
</script>
</body>
</html>
