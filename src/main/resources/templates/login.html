<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <meta name="theme-color" content="#2a5d9f">
</head>
<body>
<main>
    <h1>Log in</h1>

    <p class="error" th:if="${param.error}">That username and password don't match. Check both and try again.</p>
    <p class="saved" th:if="${param.logout}">You are logged out.</p>

    <form th:action="@{/login}" method="post">
        <label>Username
            <input type="text" name="username" autocomplete="username" autocapitalize="none" required
                   th:value="${username}" th:attr="autofocus=${username == null} ? 'autofocus' : null">
        </label>
        <label>Password
            <input type="password" name="password" id="password" autocomplete="current-password" required
                   th:attr="autofocus=${username != null} ? 'autofocus' : null">
        </label>
        <label class="confirm" id="show-password-label" hidden>
            <input type="checkbox" id="show-password"> Show password
        </label>
        <label class="confirm">
            <input type="checkbox" name="remember" checked> Stay logged in on this device for 30 days
        </label>
        <div class="form-buttons">
            <button type="submit">Log in</button>
        </div>
    </form>
</main>
<script>
    // Without JavaScript the box would do nothing, so it only appears with it.
    document.getElementById('show-password-label').hidden = false;
    document.getElementById('show-password').addEventListener('change', e => {
        document.getElementById('password').type = e.target.checked ? 'text' : 'password';
    });
</script>
</body>
</html>
