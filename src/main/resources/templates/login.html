<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main>
    <h1>Log in</h1>

    <p class="error" th:if="${param.error}">That username and password don't match. Check both and try again.</p>
    <p class="saved" th:if="${param.logout}">You are logged out.</p>

    <form th:action="@{/login}" method="post">
        <label>Username
            <input type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <label class="confirm">
            <input type="checkbox" name="remember" checked> Stay logged in on this device for 30 days
        </label>
        <div class="form-buttons">
            <button type="submit">Log in</button>
        </div>
    </form>
</main>
</body>
</html>
