<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meal</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main th:with="total=${meal.fatTotal()}, over=${threshold != null and total > threshold}">
    <h1 th:text="${#temporals.format(meal.eatenAt, 'EEE d MMM, HH:mm')}">Meal</h1>
    <p><a th:href="@{/days/{d}(d=${meal.eatenAt.toLocalDate()})}">&larr; Timeline for this day</a></p>

    <p class="total" th:classappend="${over} ? 'over'">
        <strong th:text="|${#numbers.formatDecimal(total, 1, 1)} g fat|">0 g fat</strong>
        <span th:if="${threshold == null}">· No fat limit set yet. <a th:href="@{/settings}">Set one</a></span>
        <span th:if="${over}"
              th:text="|· Over your ${#numbers.formatDecimal(threshold, 1, 1)} g limit by ${#numbers.formatDecimal(total - threshold, 1, 1)} g|"></span>
        <span th:if="${threshold != null and !over}"
              th:text="|· Within your ${#numbers.formatDecimal(threshold, 1, 1)} g limit|"></span>
    </p>

    <ul class="items">
        <li th:each="i : ${meal.items}">
            <span th:text="${i.food.name}">Food</span>
            <span class="muted"
                  th:text="|${i.grams.stripTrailingZeros().toPlainString()} g · ${#numbers.formatDecimal(i.fatGrams(), 1, 1)} g fat|"></span>
        </li>
    </ul>
    <p th:if="${meal.note != null}" th:text="${meal.note}"></p>

    <div class="actions">
        <a class="button" th:href="@{/meals/{id}/edit(id=${meal.id})}">Edit</a>
        <form th:action="@{/meals/{id}/delete(id=${meal.id})}" method="post">
            <button type="submit" class="danger">Delete</button>
        </form>
    </div>

    <a class="button" th:href="@{/meals/new}">Log another meal</a>
</main>
</body>
</html>
