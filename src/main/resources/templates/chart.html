<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chart</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <meta name="theme-color" content="#2a5d9f">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1>Fat per meal</h1>
    <p class="muted" th:text="|Last ${days} days: ${chart.meals.size()} meals, ${chart.episodes.size()} pain entries.|">Last 30 days.</p>
    <p th:if="${chart.threshold == null}">
        No fat limit set, so no limit line. <a th:href="@{/settings}">Set one</a>
    </p>

    <div th:if="${chart.meals.isEmpty() and chart.episodes.isEmpty()}" class="empty">
        <p>Nothing logged in the last <span th:text="${days}">30</span> days, so there is nothing to draw yet.</p>
        <div class="actions">
            <a class="button" th:href="@{/meals/new}">Log a meal</a>
            <a class="button" th:href="@{/episodes/new}">Log pain</a>
        </div>
    </div>
    <th:block th:unless="${chart.meals.isEmpty() and chart.episodes.isEmpty()}">
    <th:block th:fragment="chart">
    <div class="chart"><canvas id="chart" aria-label="Fat per meal over the last 30 days, with pain episodes"></canvas></div>
    <p class="hint">Dots are meals (fat in grams, left axis). Triangles are pain episodes (severity, right axis).
        <th:block th:if="${chartLinks}">Tap a point to open it.</th:block></p>
<script th:inline="javascript">
    const meals = /*[[${mealPoints}]]*/ [];
    const episodes = /*[[${episodePoints}]]*/ [];
    const threshold = /*[[${chart.threshold}]]*/ null;
    const from = /*[[${fromMillis}]]*/ 0, to = /*[[${toMillis}]]*/ 0;

    const datasets = [
        {label: 'Meal fat (g)', data: meals, yAxisID: 'fat', backgroundColor: '#2a5d9f', pointRadius: 4},
        {label: 'Pain (0–10)', data: episodes, yAxisID: 'pain', backgroundColor: '#7b52b9',
            pointStyle: 'triangle', pointRadius: 7},
    ];
    if (threshold !== null) {
        datasets.push({label: 'Fat limit', type: 'line', data: [{x: from, y: +threshold}, {x: to, y: +threshold}],
            yAxisID: 'fat', borderColor: '#b00020', borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5});
    }
    const day = ms => new Date(ms).toLocaleDateString(undefined, {timeZone: 'UTC', day: 'numeric', month: 'short'});
    const time = ms => new Date(ms).toLocaleString(undefined,
        {timeZone: 'UTC', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});

    const chart = new Chart(document.getElementById('chart'), {
        type: 'scatter',
        data: {datasets},
        options: {
            maintainAspectRatio: false,
            scales: {
                x: {min: from, max: to - 1, ticks: {callback: day, maxTicksLimit: 6}},
                fat: {position: 'left', beginAtZero: true, title: {display: true, text: 'Fat (g)'}},
                pain: {position: 'right', min: 0, max: 10, grid: {drawOnChartArea: false},
                    title: {display: true, text: 'Pain'}},
            },
            plugins: {
                legend: {position: 'bottom'},
                tooltip: {callbacks: {label: c => `${c.dataset.label}: ${c.parsed.y} · ${time(c.parsed.x)}`}},
            },
            onClick: (event, elements) => {
                const point = elements.length && chart.data.datasets[elements[0].datasetIndex].data[elements[0].index];
                if (point && point.url) location.href = point.url;
            },
        },
    });
</script>
    </th:block>
    </th:block>
</main>
</body>
</html>
