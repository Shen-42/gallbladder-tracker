# Render Blueprint: the app, built from the Dockerfile, on Render's free plan.
# The database is on Neon's free plan, which doesn't expire.
services:
  - type: web
    name: gallbladder-tracker
    runtime: docker
    plan: free              # sleeps after 15 idle minutes; the next visit takes about a minute to wake it
    region: singapore       # closest Render region to Shanghai; can't be changed later
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL   # Neon connection string (postgresql://...?sslmode=require); Render asks for it on first setup
        sync: false
      - key: TZ
        value: Asia/Shanghai
      - key: APP_USERNAME
        value: me
      - key: APP_PASSWORD   # Render asks for this when the Blueprint is first created
        sync: false
      - key: USDA_API_KEY   # free key from https://fdc.nal.usda.gov/api-key-signup; leave empty to use DEMO_KEY
        sync: false
