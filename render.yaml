# Render Blueprint: the app (built from the Dockerfile) and its Postgres database.
# In the Render dashboard choose New > Blueprint and pick this repo. See README "Deploy to Render".
services:
  - type: web
    name: gallbladder-tracker
    runtime: docker
    plan: free              # sleeps after 15 idle minutes; the next visit takes about a minute to wake it
    region: singapore       # closest Render region to Shanghai; can't be changed later
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gallbladder-db
          property: connectionString
      - key: TZ
        value: Asia/Shanghai
      - key: APP_USERNAME
        value: me
      - key: APP_PASSWORD   # Render asks for this when the Blueprint is first created
        sync: false
      - key: USDA_API_KEY   # free key from https://fdc.nal.usda.gov/api-key-signup; leave empty to use DEMO_KEY
        sync: false

databases:
  - name: gallbladder-db
    plan: free              # Render deletes free databases 30 days after creation: download the CSV regularly
    region: singapore
    postgresMajorVersion: "17"
    databaseName: gallbladder
    user: gallbladder
    ipAllowList: []         # only the app, over Render's private network, can reach the database
